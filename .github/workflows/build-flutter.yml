name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
      userId:
        required: false
        default: "0"
      payload:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Parse payload
        id: p
        run: |
          echo '${{ github.event.inputs.payload }}' > payload.json
          echo "mode=$(jq -r '.mode // "zip"' payload.json)" >> $GITHUB_OUTPUT
          echo "url=$(jq -r '.url // ""' payload.json)" >> $GITHUB_OUTPUT
          echo "buildType=$(jq -r '.buildType // "release"' payload.json)" >> $GITHUB_OUTPUT
          echo "appName=$(jq -r '.appName // "MyApp"' payload.json)" >> $GITHUB_OUTPUT
          echo "iconUrl=$(jq -r '.iconUrl // ""' payload.json)" >> $GITHUB_OUTPUT

      - name: Download & extract project
        if: steps.p.outputs.mode == 'zip'
        run: |
          mkdir -p work
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o src.zip "${{ steps.p.outputs.url }}"
          unzip -q src.zip -d work
          if [ ! -f work/pubspec.yaml ]; then
            d=$(dirname "$(find work -maxdepth 3 -name pubspec.yaml | head -1)")
            [ -n "$d" ] && mv "$d" work_real && rm -rf work && mv work_real work
          fi

      - name: Siapkan project web2apk
        if: steps.p.outputs.mode == 'url'
        run: |
          cp -r template work
          sed -i "s|WEB_URL|${{ steps.p.outputs.url }}|g" work/lib/config.dart
          sed -i "s|APP_NAME|${{ steps.p.outputs.appName }}|g" work/lib/config.dart
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ steps.p.outputs.appName }}\"|" work/android/app/src/main/AndroidManifest.xml
          if [ -n "${{ steps.p.outputs.iconUrl }}" ]; then
            mkdir -p work/assets
            curl -L -o work/assets/icon.png "${{ steps.p.outputs.iconUrl }}"
          fi

      - name: Flutter pub get
        working-directory: work
        run: flutter pub get

      - name: Build APK
        working-directory: work
        run: |
          W=android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$W" ]; then
            sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-9.3.1-bin.zip#' "$W"
            grep distributionUrl "$W"
          fi
          sed -i '/com\.android\.application/s/version "[0-9.]*"/version "9.1.0"/' android/settings.gradle.kts
          sed -i '/org\.jetbrains\.kotlin\.android/s/version "[0-9.]*"/version "2.2.10"/' android/settings.gradle.kts
          printf '\nandroid.newDsl=false\nandroid.builtInKotlin=false\n' >> android/gradle.properties
          
          if [ "${{ steps.p.outputs.buildType }}" = "debug" ]; then
            flutter build apk --debug --android-skip-build-dependency-validation
          else
            flutter build apk --release --android-skip-build-dependency-validation
          fi

      - name: Siapkan output
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          mkdir -p out
          if [ "${{ steps.p.outputs.buildType }}" = "debug" ]; then
            cp work/build/app/outputs/flutter-apk/app-debug.apk out/app.apk
          elif [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > my.jks
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -p -f 4 work/build/app/outputs/flutter-apk/app-release.apk aligned.apk
            $BT/apksigner sign --ks my.jks --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASS" --key-pass pass:"$KEY_PASS" \
              --out out/app.apk aligned.apk
          else
            cp work/build/app/outputs/flutter-apk/app-release.apk out/app.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: out/app.apk
          retention-days: 1
